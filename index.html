<!doctype html><html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Limb · Карта навыков</title><style>
*{box-sizing:border-box}body{margin:0;font:15px Inter,-apple-system,BlinkMacSystemFont,sans-serif;color:#162d32;background:#f6f5ef}header{height:68px;padding:0 24px;display:flex;align-items:center;gap:16px;border-bottom:1px solid #cbcfc4}header b{font-family:Georgia,serif;font-size:28px}header span{border-left:1px solid #bcc5ba;padding-left:16px;font-weight:600}main{display:grid;grid-template-columns:minmax(0,1fr) 315px;height:calc(100dvh - 68px)}#map{position:relative;overflow:hidden;background-color:#edf1e8;background-image:radial-gradient(#b8c7bb 1px,transparent 1px);background-size:18px 18px}#surface{position:absolute;inset:0;touch-action:none;cursor:grab;overflow:hidden}#surface:active{cursor:grabbing}#world{position:absolute;transform-origin:0 0;width:1280px;height:910px}svg{position:absolute;inset:0;pointer-events:none}path{fill:none;stroke-width:2.5}button{font:inherit;color:inherit;cursor:pointer}button:focus-visible{outline:3px solid #295cff;outline-offset:2px}.node{position:absolute;width:202px;height:66px;border:1px solid #a3afa6;border-left:6px solid var(--tone);border-radius:9px;background:#fffef9;text-align:left;padding:8px 12px;box-shadow:0 3px 7px #1d30200b}.node strong{display:block;font-size:16px;margin-bottom:4px}.node small{font-size:12px;color:#51625b}.node.active{outline:3px solid var(--tone);outline-offset:2px}.node.route{background:#fff8e2}.nav,.tools{position:absolute;display:flex;gap:4px;padding:5px;border:1px solid #bcc9bc;border-radius:11px;background:#fffef8f5;box-shadow:0 3px 12px #23413112}.nav{top:12px;left:12px}.tools{bottom:14px;left:12px}.nav button,.tools button{border:none;border-radius:7px;background:transparent;padding:7px 10px;font-weight:600;font-size:13px}.nav button:hover,.tools button:hover,.jump:hover{background:#e5ece1}#zoom{align-self:center;font-size:12px;min-width:38px;text-align:center}aside{border-left:1px solid #c3cbbf;padding:26px 23px;overflow:auto;background:#fffef8}h1{font:600 30px/1.1 Georgia,serif;margin:14px 0}h2{font-size:12px;text-transform:uppercase;letter-spacing:.08em;margin:22px 0 8px;color:#526860}#branch{font-size:13px;font-weight:700}.meta{font-size:13px;color:#596962}p{line-height:1.5}.jump{display:block;width:100%;border:1px solid #cbd3c7;border-radius:7px;text-align:left;padding:8px 10px;background:#f5f7ee;margin:4px 0}.crumb{background:none;border:none;text-decoration:underline;padding:3px 1px}.hint{font-size:12px;color:#53635e;line-height:1.5;margin-top:22px}
@media(max-width:740px){header{height:47px;padding:0 12px}header b{font-size:23px}main{height:calc(100dvh - 47px);grid-template-columns:1fr;grid-template-rows:minmax(0,1.6fr) minmax(0,1fr)}aside{border-left:0;border-top:1px solid #b6c5ba;padding:12px 18px}.nav{top:5px;left:5px}.nav button{padding:7px}.tools{bottom:5px;left:5px}h1{font-size:23px;margin:6px 0}}
</style><header><b>Limb</b><span>Карта навыков</span></header><main><section id="map" aria-label="Интерактивное дерево"><div id="surface"><div id="world"><svg width="1280" height="910" id="edges"></svg></div></div><nav class="nav" aria-label="Переход к ветке"></nav><div class="tools"><button id="minus" aria-label="Уменьшить">−</button><span id="zoom"></span><button id="plus" aria-label="Увеличить">+</button><button id="all">Всё дерево</button></div></section><aside><div id="branch"></div><h1></h1><div class="meta"></div><p id="detail"></p><h2>Путь от старта</h2><div id="trail"></div><section id="nextBlock"><h2>Дальше по ветке</h2><div id="next"></div></section><p class="hint">Перетащите карту, чтобы осмотреть ветки. Колесо или жест двумя пальцами меняет масштаб. Нажмите навык или шаг пути, чтобы перейти к нему.</p></aside></main><script>
const nodes=[
  {"name":"Первый улов","parent":-1,"branch":0,"y":450,"ranks":1,"level":0,"detail":"сокращает удержание для ручного запуска сбора на N%. Общий старт даёт эффект у первой же лунки.","kind":"Пассивный"},
  {"name":"Быстрый ход","parent":0,"branch":1,"y":165,"ranks":3,"level":1,"detail":"повышает скорость вперёд на N%. Сокращает дорогу до лунки и обратно при любом выборе оснастки.","kind":"Пассивный"},
  {"name":"Палубная клетка","parent":1,"branch":1,"y":45,"ranks":1,"level":2,"detail":"Добавляет клетку на N зайцев. Зайцы видны в клетке и сидят спокойно.","kind":"Пассивный"},
  {"name":"Вторая клетка","parent":2,"branch":1,"y":45,"ranks":1,"level":3,"detail":"Добавляет ещё N безопасных мест. Улов сначала занимает свободные места в клетках, затем попадает на открытую палубу.","kind":"Пассивный"},
  {"name":"Сбор со штурвала","parent":1,"branch":1,"y":205,"ranks":1,"level":2,"detail":"У штурвала появляется рычаг рыболовной сети. Подведи борт к лунке: доступная цель подсветится. По нажатию рычага сеть раскроется между бортом и лункой. Пока лодка в зоне вылова, лебёдка автоматически поднимает по зайцу каждые N секунд. Зайцы занимают свободные места по обычному приоритету. Игрок всё время управляет лодкой. Когда лунка опустеет, места закончатся или лодка выйдет из зоны, сеть втянется. Оставшихся зайцев можно забрать следующим заходом.","kind":"Активный"},
  {"name":"Быстрый подъём","parent":4,"branch":1,"y":205,"ranks":3,"level":3,"detail":"Сокращает интервал между посадками на N% при ручном вылове и при работе сети.","kind":"Пассивный"},
  {"name":"Крепкая обшивка","parent":1,"branch":1,"y":290,"ranks":3,"level":2,"detail":"повышает максимум прочности на N%. Открывает путь для игрока, который рискует потерять улов на обратной дороге.","kind":"Пассивный"},
  {"name":"Аварийная латка","parent":6,"branch":1,"y":290,"ranks":1,"level":3,"detail":"Герой на палубе восстанавливает N% максимальной прочности. Запас на заплыв — N применений.","kind":"Активный"},
  {"name":"Привыкание","parent":0,"branch":2,"y":458,"ranks":3,"level":1,"detail":"даёт каждому зайцу на открытой палубе дополнительные N с спокойствия после посадки. Входной навык позволяет закончить манёвр подле лунки.","kind":"Пассивный"},
  {"name":"Свист","parent":8,"branch":2,"y":408,"ranks":1,"level":2,"detail":"с палубы или из-за руля прерывает начавшиеся побеги и прогрызания. Все зайцы на палубе спокойны N с. Перезарядка N с. Ранняя активная способность помогает, когда угроз несколько.","kind":"Активный"},
  {"name":"Долгий свист","parent":9,"branch":2,"y":408,"ranks":3,"level":3,"detail":"увеличивает длительность спокойствия до N с. Это докачка для игрока, которому уже знаком свист, но обычно не хватает времени на манёвр.","kind":"Пассивный"},
  {"name":"Спокойные руки","parent":8,"branch":2,"y":515,"ranks":3,"level":2,"detail":"после ручного успокоения заяц спокоен N с. Так игрок осваивает действие, которое затем сможет поручить коту.","kind":"Пассивный"},
  {"name":"Палубный кот","parent":11,"branch":2,"y":515,"ranks":1,"level":3,"detail":"пассивно ходит по палубе, подходит к одному зайцу и успокаивает его на N с. В приоритете зайцы, готовые сбежать или грызущие лодку. Кот помогает с одиночными угрозами во время руления.","kind":"Пассивный"},
  {"name":"Долгое мурчание","parent":12,"branch":2,"y":515,"ranks":3,"level":4,"detail":"увеличивает спокойствие после визита кота до N с. На полной палубе это даёт коту время дойти до следующего зайца.","kind":"Пассивный"},
  {"name":"Милость Богини","parent":0,"branch":3,"y":741,"ranks":3,"level":1,"detail":"При обмене доставленных зайцев в хабе начисляет дополнительно N% ОП от базовой награды. Для каждого из трёх уровней баланс задаёт свой итоговый процент. Применяется бонус текущего уровня.","kind":"Пассивный"},
  {"name":"Щедрые лунки","parent":14,"branch":3,"y":650,"ranks":1,"level":2,"detail":"Показывает на мини-карте, сколько зайцев осталось в каждой видимой лунке. Помогает выбрать цель с учётом расстояния и свободных мест.","kind":"Пассивный"},
  {"name":"Дальний обзор","parent":14,"branch":3,"y":738,"ranks":3,"level":2,"detail":"Увеличивает радиус мини-карты на N%. После «Милости Богини» помогает выбирать следующие лунки на большем расстоянии.","kind":"Пассивный"},
  {"name":"Оберег окраины","parent":14,"branch":3,"y":826,"ranks":1,"level":2,"detail":"Узел прогресса для первого нового региона. Предлагаемая цель — доставить в хаб N зайцев из стартового региона. Формат доступа и эффект оберега зависят от решения по локациям в ТЗ.","kind":"За цель"},
  {"name":"Оберег глубин","parent":17,"branch":3,"y":826,"ranks":1,"level":3,"detail":"Следующий региональный рубеж после «Оберега окраины». Предлагаемая цель — доставить в хаб N зайцев из уже доступного региона. Эффект зависит от решения по локациям в ТЗ.","kind":"За цель"},
  {"name":"Просторная палуба","parent":1,"branch":1,"y":122,"ranks":3,"level":2,"detail":"Каждый уровень добавляет N мест на открытой палубе. Лодка может забрать больше зайцев за рейс. Зайцы на этих местах свободно двигаются, могут сбежать или прогрызть обшивку. Для безопасной перевозки служат клетки.","kind":"Пассивный"}
];
function rankLabel(n){return n.ranks===1?'1 уровень':'3 уровня'}
const labels=['Старт','Лодка','Уход за зайцами','Благословения Богини'],colors=['#405044','#19738b','#936431','#765c95'],q=s=>document.querySelector(s),world=q('#world'),surface=q('#surface'),edges=q('#edges'),buttons=[],paths=[];let current=0,scale=1,tx=0,ty=0;
function x(i){return 30+nodes[i].level*250}
function y(i){return nodes[i].y}
function act(label,fn,cl){const b=document.createElement('button');b.textContent=label;b.onclick=fn;if(cl)b.className=cl;return b}
nodes.forEach((n,i)=>{if(n.parent>=0){const p=document.createElementNS('http://www.w3.org/2000/svg','path'),sx=x(n.parent)+202,ex=x(i),mid=(sx+ex)/2,sy=y(n.parent)+33,ey=y(i)+33;p.setAttribute('d','M'+sx+' '+sy+' C'+mid+' '+sy+' '+mid+' '+ey+' '+ex+' '+ey);edges.append(p);paths[i]=p}
const b=act('',()=>{if(!suppress)select(i)},'node');b.style.cssText='left:'+x(i)+'px;top:'+y(i)+'px;--tone:'+colors[n.branch];b.innerHTML='<strong>'+n.name+'</strong><small>'+n.kind+' · '+rankLabel(n)+'</small>';buttons.push(b);world.append(b)});
function paint(){world.style.transform='translate('+tx+'px,'+ty+'px) scale('+scale+')';q('#zoom').textContent=Math.round(scale*100)+'%'}
function center(i){tx=surface.clientWidth/2-(x(i)+101)*scale;ty=surface.clientHeight/2-(y(i)+33)*scale;paint()}
function select(i,move=false){current=i;const n=nodes[i],chain=[];for(let j=i;j>=0;j=nodes[j].parent)chain.unshift(j);buttons.forEach((b,k)=>{b.classList.toggle('active',k===i);b.classList.toggle('route',chain.includes(k));b.setAttribute('aria-pressed',k===i);if(paths[k]){paths[k].style.stroke=chain.includes(k)?colors[n.branch]:'#9eafa1';paths[k].style.strokeWidth=chain.includes(k)?5:2.5}});q('#branch').textContent=labels[n.branch];q('#branch').style.color=colors[n.branch];q('h1').textContent=n.name;q('.meta').textContent=n.kind+' · '+rankLabel(n);q('#detail').textContent=n.detail[0].toUpperCase()+n.detail.slice(1);q('#trail').replaceChildren();chain.forEach((k,a)=>{if(a)q('#trail').append(' → ');q('#trail').append(act(nodes[k].name,()=>select(k,true),'crumb'))});const children=nodes.map((v,k)=>v.parent===i?k:-1).filter(k=>k>=0);q('#nextBlock').hidden=!children.length;q('#next').replaceChildren(...children.map(k=>act(nodes[k].name+' →',()=>select(k,true),'jump')));if(move){scale=Math.max(scale,.84);center(i)}}
function fit(){scale=Math.min(1.25,(surface.clientWidth-24)/1264,(surface.clientHeight-112)/910);tx=(surface.clientWidth-1264*scale)/2;ty=50+(surface.clientHeight-102-910*scale)/2;paint()}
function zoom(f,px=surface.clientWidth/2,py=surface.clientHeight/2){const s=Math.max(.15,Math.min(2.5,scale*f));tx=px-(px-tx)*s/scale;ty=py-(py-ty)*s/scale;scale=s;paint()}
nodes.map((n,i)=>n.parent===0?i:-1).filter(i=>i>=0).forEach((i,k)=>q('.nav').append(act(['Лодка','Зайцы','Богиня'][k],()=>select(i,true))));q('#all').onclick=fit;q('#plus').onclick=()=>zoom(1.25);q('#minus').onclick=()=>zoom(.8);
surface.onwheel=e=>{e.preventDefault();let r=surface.getBoundingClientRect();zoom(Math.exp(-e.deltaY*.0018),e.clientX-r.left,e.clientY-r.top)};
let points=new Map(),suppress=false,down=null;const pair=()=>{let [a,b]=[...points.values()];return {x:(a.x+b.x)/2,y:(a.y+b.y)/2,d:Math.hypot(b.x-a.x,b.y-a.y)}};
surface.onpointerdown=e=>{if(e.button!==0)return;if(!points.size){down={x:e.clientX,y:e.clientY};suppress=false}points.set(e.pointerId,{x:e.clientX,y:e.clientY});e.target.setPointerCapture(e.pointerId)};
surface.onpointermove=e=>{let p=points.get(e.pointerId);if(!p)return;const prev=points.size===2?pair():null;points.set(e.pointerId,{x:e.clientX,y:e.clientY});if(Math.hypot(e.clientX-down.x,e.clientY-down.y)>4||prev)suppress=true;if(prev){const now=pair(),r=surface.getBoundingClientRect();if(prev.d>0)zoom(now.d/prev.d,prev.x-r.left,prev.y-r.top);tx+=now.x-prev.x;ty+=now.y-prev.y}else if(suppress){tx+=e.clientX-p.x;ty+=e.clientY-p.y}paint()};
surface.onpointerup=surface.onpointercancel=e=>{points.delete(e.pointerId);if(!points.size)setTimeout(()=>suppress=false,0)};window.addEventListener('resize',()=>center(current));select(0);if(surface.clientWidth<950){scale=.9;center(0)}else fit();
</script></html>
